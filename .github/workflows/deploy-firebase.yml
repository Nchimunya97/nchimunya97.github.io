# Firebase Hosting deploys
#
#   push to stage  →  "stage" preview channel  (stable URL, refreshed on every push)
#   push to main   →  live site                 (portfolio-website-d1aaa.web.app)
#   pull request   →  temporary preview URL, posted as a comment on the PR
#
# Needs one repo secret: FIREBASE_SERVICE_ACCOUNT (see README → Firebase Hosting).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # forks don't get access to secrets, so skip their PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck & build (Turborepo)
        run: npm run build
        env:
          BASE_PATH: /
          VITE_DEPLOY_ENV: ${{ github.event_name == 'push' && github.ref_name == 'main' && 'production' || 'staging' }}

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: portfolio-website-d1aaa
          # live for main, a named "stage" channel for stage, per-PR previews otherwise
          channelId: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'live' || 'stage') || '' }}
          expires: 30d
